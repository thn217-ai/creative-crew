openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: creative
    description: Google ADK-powered creative development
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /creative-treatment:
    post:
      operationId: createCreativeTreatment
      tags: [creative]
      summary: Create a structured creative treatment
      description: Runs a real Google ADK agent backed by Gemini and returns a validated treatment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreativeBriefInput"
      responses:
        "200":
          description: Creative treatment generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreativeTreatment"
        "400":
          description: Missing or invalid creative brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: Google AI generation failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    CreativeBriefInput:
      type: object
      properties:
        brief:
          type: string
          minLength: 20
          maxLength: 5000
      required:
        - brief
    CreativeTreatment:
      type: object
      properties:
        title:
          type: string
        logline:
          type: string
        centralIdea:
          type: string
        emotionalDirection:
          type: string
        tone:
          type: array
          items:
            type: string
        narrativeApproach:
          type: string
        visualPrinciples:
          type: array
          items:
            type: string
        audiencePromise:
          type: string
        guardrails:
          type: array
          items:
            type: string
        generatedBy:
          type: string
          enum: [google-adk-gemini]
      required:
        - title
        - logline
        - centralIdea
        - emotionalDirection
        - tone
        - narrativeApproach
        - visualPrinciples
        - audiencePromise
        - guardrails
        - generatedBy
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

